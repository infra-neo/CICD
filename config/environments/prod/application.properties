# Production Environment Properties
# Version: 1.0.0
# Last Updated: 2025-10-25

# Database Configuration
db.url=jdbc:postgresql://postgres:5432/proddb
db.username=produser
db.password=${DB_PASSWORD_PROD}

# Application Settings
app.name=sample-app
app.version=${APP_VERSION}
app.environment=production
app.debug=false

# Server Configuration
server.port=8080
server.host=0.0.0.0

# Logging
logging.level=WARN
logging.file=/var/log/app/prod-app.log

# External Services
nexus.url=http://nexus:8081
sonar.url=http://sonarqube:9000

# Feature Flags
feature.newui.enabled=false
feature.beta.enabled=false
