# Staging Environment Properties
# Version: 1.0.0
# Last Updated: 2025-10-25

# Database Configuration
db.url=jdbc:postgresql://postgres:5432/stagingdb
db.username=staginguser
db.password=${DB_PASSWORD_STAGING}

# Application Settings
app.name=sample-app
app.version=${APP_VERSION}
app.environment=staging
app.debug=false

# Server Configuration
server.port=8080
server.host=0.0.0.0

# Logging
logging.level=INFO
logging.file=/var/log/app/staging-app.log

# External Services
nexus.url=http://nexus:8081
sonar.url=http://sonarqube:9000

# Feature Flags
feature.newui.enabled=true
feature.beta.enabled=false
