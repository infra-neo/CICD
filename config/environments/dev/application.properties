# Development Environment Properties
# Version: 1.0.0
# Last Updated: 2025-10-25

# Database Configuration
db.url=jdbc:postgresql://postgres:5432/devdb
db.username=devuser
db.password=${DB_PASSWORD_DEV}

# Application Settings
app.name=sample-app
app.version=${APP_VERSION}
app.environment=development
app.debug=true

# Server Configuration
server.port=8080
server.host=0.0.0.0

# Logging
logging.level=DEBUG
logging.file=/var/log/app/dev-app.log

# External Services
nexus.url=http://nexus:8081
sonar.url=http://sonarqube:9000

# Feature Flags
feature.newui.enabled=true
feature.beta.enabled=true
