version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/init.groovy.d:/usr/share/jenkins/ref/init.groovy.d
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - cicd-network

  postgres:
    image: postgres:13
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonarqube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cicd-network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd-network

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=273m
    networks:
      - cicd-network

  wildfly:
    image: quay.io/wildfly/wildfly:latest
    container_name: wildfly
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "9990:9990"
    volumes:
      - wildfly_deployments:/opt/jboss/wildfly/standalone/deployments
      - wildfly_data:/opt/jboss/wildfly/standalone/data
      - wildfly_config:/opt/jboss/wildfly/standalone/configuration
      - ./config/wildfly:/etc/wildfly-config
    environment:
      - WILDFLY_USER=admin
      - WILDFLY_PASS=admin
    command: ["/opt/jboss/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]
    networks:
      - cicd-network

  jboss:
    image: jboss/wildfly:20.0.1.Final
    container_name: jboss
    restart: unless-stopped
    ports:
      - "8070:8080"
      - "9970:9990"
    volumes:
      - jboss_deployments:/opt/jboss/wildfly/standalone/deployments
      - jboss_data:/opt/jboss/wildfly/standalone/data
      - jboss_config:/opt/jboss/wildfly/standalone/configuration
      - ./config/jboss:/etc/jboss-config
    environment:
      - JBOSS_USER=admin
      - JBOSS_PASS=admin
    command: ["/opt/jboss/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]
    networks:
      - cicd-network

networks:
  cicd-network:
    driver: bridge

volumes:
  jenkins_home:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
  wildfly_deployments:
  wildfly_data:
  wildfly_config:
  jboss_deployments:
  jboss_data:
  jboss_config:
